<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球政要与官方动态实时看板</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent: #3498db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 24px; margin-bottom: 8px; color: #1a202c; }
        header p { color: var(--text-muted); font-size: 14px; }
        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge { background-color: #ebf8ff; color: #3182ce; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .time { font-size: 12px; color: var(--text-muted); }
        h2 { font-size: 18px; margin: 0 0 8px 0; line-height: 1.4; }
        h2 a { color: #2d3748; text-decoration: none; }
        h2 a:hover { color: var(--accent); }
        .summary { font-size: 14px; color: #4a5568; line-height: 1.6; margin-bottom: 12px; }
        .read-more { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
        .translating-tag { font-size: 11px; color: #e67e22; margin-left: 8px; font-weight: normal; }
        footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 全球政要与官方动态实时看板</h1>
            <p>实时抓取官方资讯 <span id="trans-status" style="color: #3498db;">(正在异步翻译为中文...)</span></p>
        </header>
        <div class="news-list" id="news-container"></div>
        <footer><p>Powered by GitHub Actions & Frontend Async Translation</p></footer>
    </div>

    <script>

net $15 for every dollar spent", "summary": "Tackling air pollution and climate change together can save millions of lives, reduce global warming and generate roughly $15 in economic benefits for every $1 spent, a new UN-backed report has revealed.", "link": "https://news.un.org/feed/view/en/story/2026/09/1168283", "time": "2026-09-07 12:00"}, {"source": "European Commission", "title": "Joint Declaration by the European Union, on the one hand, and the Government of  Greenland and the Government of Denmark, on the other,  on relations between the European Union and Greenland", "summary": "European Commission Statement Nuuk, 07 Sep 2026 \n\nThe European Union, on the one hand, and the Government of Greenland and the Government of Denmark, on the other, (hereinafter 'the Sides')  \n\n\n\n\nguided by th...", "link": "https://ec.europa.eu/commission/presscorner/detail/en/statement_26_1804", "time": "2026-09-07 09:56"}, {"source": "European Commission", "title": "Statement by President von der Leyen at the signing of the EU-Greenland Joint Declaration", "summary": "European Commission Statement Nuuk, 07 Sep 2026 Premier Nielsen, dear Jens-Frederik,\nPrime Minister Frederiksen, dear Mette,\nI also want to thank you for the excellent cooperation and the outstanding hospital...", "link": "https://ec.europa.eu/commission/presscorner/detail/en/statement_26_1803", "time": "2026-09-07 09:46"}, {"source": "European Commission", "title": "Daily News 07/ 09 / 2026", "summary": "European Commission Daily news Brussels, 07 Sep 2026 Commission greenlights the Netherlands' fourth payment request for €661 million under NextGenerationEU\nToday, the European Commission positively assessed the Ne...", "link": "https://ec.europa.eu/commission/presscorner/detail/en/mex_26_1802", "time": "2026-09-07 09:19"}, {"source": "UN News", "title": "‘Advance safety for all’: International police cooperation helps tackle cross-border crime", "summary": "As criminal networks increasingly exploit weak institutions and operate across borders, the UN says no police force can tackle them alone.", "link": "https://news.un.org/feed/view/en/story/2026/09/1168280", "time": "2026-09-06 12:00"}, {"source": "UN News", "title": "New reservoir offers innovative solution to South Sudan cattle beef", "summary": "At the end of a history-laden path winding through palm trees and scattered ruins – remnants of once-vibrant villages destroyed by cattle raids – lies a rare sight in this dry part of Terekeka county in South Sudan: a sp", "link": "https://news.un.org/feed/view/en/story/2026/09/1168266", "time": "2026-09-06 12:00"}, {"source": "The White House", "title": "Congressional Bill H.R. 6500 Signed into Law", "summary": "On Wednesday, September 2, 2026, the President signed into law: H.R. 6500, the &#8220;Continuing Appropriations and Extensions Act, 2027,&#8221; which includes a short-term continuing resolution that provides fiscal year", "link": "https://www.whitehouse.gov/briefings-statements/2026/09/congressional-bill-h-r-6500-signed-into-law/", "time": "2026-09-03 00:02"}, {"source": "The White House", "title": "Presidential Message on National Preparedness Month", "summary": "America has always been a nation of strong, capable, and determined people who understand that strength must be built before crisis. &#160;Preparedness builds that strength, and readiness is the result. &#160;This Nation", "link": "https://www.whitehouse.gov/briefings-statements/2026/09/presidential-message-on-national-preparedness-month-6e71/", "time": "2026-09-02 19:25"}, {"source": "The White House", "title": "Presidential Message on National Childhood Cancer Awareness Month", "summary": "This National Childhood Cancer Awareness Month, my Administration stands with the countless children facing the devastating effects of cancer.&#160; We recognize the love, strength, and care of the families who walk besi", "link": "https://www.whitehouse.gov/briefings-statements/2026/09/presidential-message-on-national-childhood-cancer-awareness-month/", "time": "2026-09-02 15:59"}, {"source": "The White House", "title": "Presidential Message on National Recovery Month", "summary": "During National Recovery Month, we celebrate the more than 23 million Americans who have found a pathway from addiction to recovery, we recognize those who have helped them reclaim their lives, and we renew our commitmen", "link": "https://www.whitehouse.gov/briefings-statements/2026/09/presidential-message-on-national-recovery-month/", "time": "2026-09-02 15:58"}, {"source": "The White House", "title": "Presidential Message on Overdose and Drug Poisoning Awareness Week", "summary": "During Overdose and Drug Poisoning Awareness Week, our Nation renews its resolve to defeat the scourge of illicit drugs and synthetic poisons that have devastated hundreds of thousands of American lives.&#160; My Adminis", "link": "https://www.whitehouse.gov/briefings-statements/2026/08/presidential-message-on-overdose-and-drug-poisoning-awareness-week/", "time": "2026-08-25 02:00"}];

        async function translateText(text) {
            if (!text) return "";
            try {
                // 使用免费稳定的 MyMemory 翻译 API 进行异步请求
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    let translated = data.responseData.translatedText;
                    // 过滤掉 API 配额超限时的提示污染
                    if (!translated.includes("MYMEMORY WARNING")) {
                        return translated;
                    }
                }
            } catch (e) {
                console.log("Translation error:", e);
            }
            return text; // 失败或超时则降级返回原文
        }

        async function render() {
            const container = document.getElementById('news-container');
            let htmlContent = '';

            // 先瞬间渲染英文骨架，保证秒开
            rawData.forEach((item, index) => {
                htmlContent += `
                <div class="news-card" id="card-${index}">
                    <div class="card-header">
                        <span class="badge">${item.source}</span>
                        <span class="time">${item.time}</span>
                    </div>
                    <h2><a href="${item.link}" target="_blank" id="title-${index}">${item.title}</a></h2>
                    <p class="summary" id="summary-${index}">${item.summary}...</p>
                    <a href="${item.link}" target="_blank" class="read-more">阅读官方原文 &rarr; <span class="translating-tag" id="tag-${index}">🔄 翻译中...</span></a>
                </div>
                `;
            });
            container.innerHTML = htmlContent;

            // 异步逐条翻译，成功即替换，失败自动保留英文
            let successCount = 0;
            for (let i = 0; i < rawData.length; i++) {
                const item = rawData[i];
                try {
                    const [zhTitle, zhSummary] = await Promise.all([
                        translateText(item.title),
                        translateText(item.summary)
                    ]);
                    
                    if (zhTitle && zhTitle !== item.title) {
                        document.getElementById(`title-${i}`).innerText = zhTitle;
                        successCount++;
                    }
                    if (zhSummary && zhSummary !== item.summary) {
                        document.getElementById(`summary-${i}`).innerText = zhSummary + '...';
                    }
                    document.getElementById(`tag-${i}`).innerText = "✅ 已译";
                    document.getElementById(`tag-${i}`).style.color = "#27ae60";
                } catch (err) {
                    document.getElementById(`tag-${i}`).innerText = "⚠️ 原文";
                }
            }
            document.getElementById('trans-status').innerText = "(中英双语实时加载完成)";
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
