<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球政要与主流媒体全景实时看板</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent: #3498db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 850px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 24px; margin-bottom: 8px; color: #1a202c; }
        header p { color: var(--text-muted); font-size: 14px; }
        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge { background-color: #ebf8ff; color: #3182ce; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
        .time { font-size: 12px; color: var(--text-muted); }
        h2 { font-size: 18px; margin: 0 0 8px 0; line-height: 1.4; }
        h2 a { color: #2d3748; text-decoration: none; }
        h2 a:hover { color: var(--accent); }
        .summary { font-size: 14px; color: #4a5568; line-height: 1.6; margin-bottom: 12px; }
        .read-more { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
        .loading-status { text-align: center; padding: 20px; color: var(--text-muted); font-size: 14px; }
        footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 全球政要与主流媒体全景看板</h1>
            <p>已启用极速分页滚动加载 (无外部请求)</p>
        </header>
        <div class="news-list" id="news-container"></div>
        <div id="loading" class="loading-status">正在加载更多资讯...</div>
        <footer><p>Powered by GitHub Actions & Infinite Scroll</p></footer>
    </div>

ust be built before crisis. &#160;Preparedness builds that strength, and re", "link": "https://www.whitehouse.gov/briefings-statements/2026/09/presidential-message-on-national-preparedness-month-6e71/", "time": "2026-09-02 19:25"}, {"source": "Wall Street Journal (华尔街日报)", "title": "Palestinians Stream Back to Northern Gaza on Foot", "summary": "Israel allowed displaced Gazans to begin crossing a military zone that bisects the enclave after a deadlock over hostage releases was broken.", "link": "https://www.wsj.com/articles/palestinians-flock-back-to-northern-gaza-on-foot-after-hostage-release-breakthrough-3f60e2db", "time": "2025-01-27 19:23"}, {"source": "Wall Street Journal (华尔街日报)", "title": "Leading China Property Developer Reports Huge loss, in Sign of Widening Real-Estate Woes", "summary": "Troubles at Vanke raise questions about the continued spread of the property crisis and whether the Chinese state will step in.", "link": "https://www.wsj.com/articles/even-chinas-property-stalwart-isnt-immune-from-the-crisis-19799863", "time": "2025-01-27 17:32"}, {"source": "CNN World (CNN)", "title": "Still haven't filed your taxes? Here's what you need to know", "summary": "So far this tax season, the IRS has received more than 90 million income tax returns for 2022.", "link": "https://www.cnn.com/2023/04/13/success/tax-filing-tips/index.html", "time": "2023-04-14 20:07"}, {"source": "CNN World (CNN)", "title": "Markets digest bank earnings after recent turmoil", "summary": "", "link": "https://www.cnn.com/business/live-news/stock-market-bank-earnings/index.html", "time": "2023-04-14 20:00"}]
    </script>

    <script>
        let allData = [];
        try {
            allData = JSON.parse(document.getElementById('news-data').textContent);
        } catch (e) {
            console.error("Data parse error:", e);
        }

        let currentIndex = 0;
        const pageSize = 10;
        const container = document.getElementById('news-container');
        const loadingIndicator = document.getElementById('loading');

        function loadMore() {
            if (currentIndex >= allData.length) {
                loadingIndicator.innerText = "已加载全部资讯";
                return;
            }

            const nextEnd = Math.min(currentIndex + pageSize, allData.length);
            const batch = allData.slice(currentIndex, nextEnd);
            
            let batchHtml = '';
            batch.forEach((item) => {
                batchHtml += `
                <div class="news-card">
                    <div class="card-header">
                        <span class="badge">${item.source}</span>
                        <span class="time">${item.time}</span>
                    </div>
                    <h2><a href="${item.link}" target="_blank">${item.title}</a></h2>
                    <p class="summary">${item.summary}...</p>
                    <a href="${item.link}" target="_blank" class="read-more">阅读原文 &rarr;</a>
                </div>
                `;
            });

            container.insertAdjacentHTML('beforeend', batchHtml);
            currentIndex = nextEnd;

            if (currentIndex >= allData.length) {
                loadingIndicator.innerText = "已加载全部资讯";
            }
        }

        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 300) {
                loadMore();
            }
        });

        loadMore();
    </script>
</body>
</html>
